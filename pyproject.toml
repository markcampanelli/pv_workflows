[project]
name = "pv-workflows"
description = "pv-workflows: Extensible computational workflows for photovoltaic (PV) energy simulation"
authors = [{name = "Mark Campanelli", email = "mark.campanelli@gmail.com"}]
# FIXME
# license = "MIT"
# license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12, <3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["PV", "measurement", "modeling", "photovoltaic", "simulation", "solar"]
dynamic = ["version"]

dependencies = [
    "array-api >=1.0.0, <2",
    "array-api-compat >=1.15.0, <2",
    "numpy >=2, <3",
    "pvlib ==0.16.1",
    "scipy >=1, <2",
]

[project.optional-dependencies]
all = [
    "pv-workflows[demo]"
]
demo = [
    "matplotlib >=3, <4",
    "pandas >=3, <4",
]

[dependency-groups]
dev = [
    "ruff >=0.16.9",
]
docs = [
    "sphinx >=9, <10",
    "sphinx_rtd_theme >=3, <4",
]
test = [
    "pytest >=9, <10",
    "pytest-cov >=7, <8",
]

[project.scripts]
pv-workflows = "pv_workflows:version"

[project.urls]
Developer = "https://intelligentmeasurementsystems.com"
Source = "https://github.com/markcampanelli/pv-workflows"
BugReports = "https://github.com/markcampanelli/pv-workflows/issues"
Discussions = "https://github.com/markcampanelli/pv-workflows/discussions"
PullRequests = "https://github.com/markcampanelli/pv-workflows/pulls"

[build-system]
requires = ["setuptools >=80", "setuptools-scm >=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
